  </g>
  <circle cx="32" cy="14" r="3.2" fill="#ffb938"/>
  <!-- the stack: three radios -->
  <rect x="12" y="28" width="40" height="7.5" rx="3.5" fill="#7fe0ee"/>
  <rect x="12" y="38" width="40" height="7.5" rx="3.5" fill="#3fb0cc"/>
  <rect x="12" y="48" width="40" height="7.5" rx="3.5" fill="#2a86a6"/>
  <g fill="#0d2635">
    <circle cx="46.5" cy="31.75" r="1.5"/>
    <circle cx="46.5" cy="41.75" r="1.5"/>
    <circle cx="46.5" cy="51.75" r="1.5"/>
