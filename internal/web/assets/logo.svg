<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="hamstack">
  <title>hamstack</title>
  <defs>
    <linearGradient id="hs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a7a"/>
      <stop offset="1" stop-color="#0d2635"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#hs-bg)"/>
  <!-- antenna with signal arcs -->
