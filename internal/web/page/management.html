{{define "management"}}
<section class="workspace" aria-label="Manage hamstack">
 <div class="workspace-heading"><div><span class="eyebrow">CONTROL CENTER</span><h2>Manage your station</h2></div><button id="manage-refresh" type="button">Refresh</button></div>
 <nav class="workspace-nav" id="manage-nav" aria-label="Management sections"></nav>
 <div id="manage-panel" class="workspace-panel"><p class="muted">Loading… (checking versions and the system can take a few seconds)</p></div>
 <div role="status" aria-live="polite" id="manage-status"></div>
 <pre id="manage-output" hidden></pre>
</section>
<style>
.workspace [hidden]{display:none!important}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.item-head h3{margin:0}.item-head p{margin:2px 0 0}
.item .inline-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.item .explain{margin:10px 0 0;font-size:.92rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:1000px){.workspace-panel>.toolbar,.workspace-panel>.wide{grid-column:1/-1}}
</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
 // The page says which tabs it shows (comma separated); a link can name one in the address (#Updates).
 const tabs={{.}}.split(",").filter(Boolean);
 let data={}, current=tabs[0], busy=false;
 try{const h=decodeURIComponent(location.hash.slice(1));if(tabs.includes(h))current=h}catch(e){}
 // A tab that lives on the other page is a link to it.
 const go=(t)=>{if(tabs.includes(t)){current=t;render()}else location.href=(["Updates","Programs","System","Maintenance"].includes(t)?"/updates#":"/settings#")+encodeURIComponent(t)};
 const panel=$("manage-panel"), output=$("manage-output"), status=$("manage-status");
 const input=(placeholder,value="")=>el("input",{placeholder,value,required:true});
 const optional=(value)=>{const i=input("",value||"");i.required=false;return i};
 const select=(values,value)=>{const s=el("select",{});for(const [v,label] of values)s.append(el("option",{value:v,textContent:label,selected:v===value}));return s};
 const button=(text,fn,cls)=>el("button",{type:"button",textContent:text,onclick:fn,disabled:busy,className:cls||""});
 const actions=(...items)=>el("div",{className:"actions"},...items);
 const card=(title,desc,...kids)=>el("article",{className:"card"},el("h3",{textContent:title}),desc?el("p",{className:"muted",textContent:desc}):null,...kids);
 // Things that are set show as a line with a pencil: the form is there only when it is asked for.
 const hid=(e)=>{e.hidden=true;return e};
 const reveal=(target)=>{target.hidden=!target.hidden;if(!target.hidden){const f=target.querySelector("input,select");if(f)f.focus()}};
 const pencil=(target,label="Edit")=>button("✎ "+label,()=>reveal(target));
 const item=(title,summary,acts,...panels)=>el("article",{className:"card item"},el("div",{className:"item-head"},el("div",{},el("h3",{textContent:title}),summary?el("p",{className:"muted",textContent:summary}):null),el("div",{className:"actions"},...acts.filter(Boolean))),...panels.filter(Boolean));
 const toolbar=(...items)=>el("div",{className:"toolbar"},...items);
 const accessName={local:"this computer only",network:"local network",all:"all interfaces"};
 const vcmp=(a,b)=>{const p=s=>String(s||"").replace(/^[vV]/,"").split(".").map(x=>parseInt(x,10)||0);const x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d<0?-1:1}return 0};
 function show(value){output.hidden=false;output.textContent=typeof value==="string"?value:JSON.stringify(value,null,2)}
 async function api(action,id="",value="",extra="",confirm=false,secret=undefined){
  if(busy)throw Error("Wait for the current operation to finish");busy=true;status.textContent="Working…";
  try{const result=await manage(action,id,value,extra,confirm,secret);status.textContent="Done";return result}
  catch(e){status.textContent=e.message||"Cancelled";status.className=e.message?"bad":"muted";toast(e.message,true);throw e}
  finally{busy=false}
 }
 async function act(action,id="",value="",extra="",confirm=false){try{const result=await api(action,id,value,extra,confirm);if(result&&result.job)startedJob(result);else if(result)show(result);await load()}catch(e){}}
 // After hamstack is updated, offer to restart what needs it (the dashboard included) and do it when asked.
 async function offerRestart(intro=""){
  let m;try{m=await api("maintenance.status")}catch(e){return}
  const list=m.services||[];if(!list.length&&!m.reload)return;
  const names=list.map(n=>n==="web"?"hamstack dashboard":n).join(", ");
  const dash=list.includes("web");
  if(!await askConfirm(intro+(names?"These need restarting to run the new version: "+names+".":"The service manager needs reloading.")+"\n\nRestart them now? Radio sessions are interrupted for a moment"+(dash?", and this page reloads when the dashboard is back":"")+"."))return;
  try{const r=await api("maintenance.apply","","","",true);show(r);if(dash){waitForDashboard();return}await load()}catch(e){}
 }
 const remove=(kind,id)=>button("Remove",async ()=>{if(await askConfirm("Remove "+id+"?"))act(kind+".remove",id,"","",true)});
 function form(label,fields,fn){const f=el("form",{className:"inline-form"});for(const [name,control] of fields)f.append(el("label",{},el("span",{textContent:name}),control));f.append(el("button",{type:"submit",textContent:label}));f.onsubmit=e=>{e.preventDefault();fn()};return f}
 // A job runs in the background: say it started, and open the Activity section where its progress and output are.
 const startedJob=(r)=>{if(r&&r.job){toast("Started. Progress and output are under Activity.");if(window.hamstackActivity)window.hamstackActivity.refresh();const a=document.getElementById("activity");if(a){a.open=true;a.scrollIntoView({behavior:"smooth",block:"start"})}}};
 const installProgram=async (name,isInstalled,source=false)=>{try{const plan=await api("program.plan",isInstalled?"update":"",name,source?"source":"");const head=String(plan||"").split("\n").slice(0,14).join("\n");if(await askConfirm((isInstalled?"Update ":"Install ")+name+(source?", built from source":"")+"?\n\n"+head+"\n\nIt runs in the background; progress and output show under Activity."))startedJob(await api("program.install",isInstalled?"update":"",name,source?"source":"",true))}catch(e){}};
 const updateSelfFlow=async ()=>{if(await askConfirm("Install the latest checksummed hamstack release? The current program is kept so you can roll back to it. It runs in the background; you are asked about restarting when it is done.")){try{startedJob(await api("updates.self","","","",true))}catch(e){}}};
 const picked=new Map(); // programs ticked for a bulk update: name -> "update" or "source"
 // When a job finishes: offer the restart after a hamstack update, and refresh what the page knows.
 window.hamstackAfterJob=async(j)=>{if(j.state==="done"&&j.restart)await offerRestart("hamstack was updated. ");else if(j.state==="done"||j.state==="failed")await load()};
 const rollbackSelfFlow=async (prev)=>{if(await askConfirm("Go back to the previous hamstack ("+prev+")? The one running now is kept, so you can go forward again the same way.")){await act("updates.rollback","","","",true);await offerRestart("hamstack went back to the previous version. ")}};

 // The modems a rig can run, from the server's one list. The modem a rig runs now is always among them, so a form
 // opened on it shows it, and saving another field leaves it running.
 function modemOpts(noCAT,current){
  const opts=(data.Modems||[]).filter(m=>!noCAT||!m.NeedsCAT).map(m=>[m.Value,m.Label]);
  if(current&&!opts.some(([v])=>v===current))opts.push([current,current]);
  return opts;
 }
 function renderRigs(rows){
  const id=input("home-radio"), profile=select((data.Profiles||[]).map(x=>[x.ID,x.Name])), modem=select(modemOpts(false));
  const addForm=hid(form("Add rig",[["Name",id],["Radio",profile],["Modem",modem]],()=>act("rig.add",id.value,profile.value,modem.value)));
  const query=input("Radio model or manufacturer"), searchForm=hid(form("Search",[["Radio model or maker",query]],()=>act("rig.search","",query.value)));
  const model=input("Hamlib model number"), speed=input("CAT baud rate","9600"), profForm=hid(form("Save radio profile",[["Hamlib model",model],["Speed",speed]],()=>act("rig.profile","",model.value,speed.value)));
  panel.append(toolbar(button("+ Add a rig",()=>reveal(addForm)),button("Find a radio in hamlib",()=>reveal(searchForm)),button("Add a radio by model number",()=>reveal(profForm))),addForm,searchForm,profForm);
  const modemNames=Object.fromEntries((data.Modems||[]).filter(m=>m.Value).map(m=>[m.Value,m.Label]));
  for(const r of rows){
   const name=optional(r.Name),cat=optional(r.Cat),audio=optional(r.Audio),bands=optional(r.Bands);
   const models=select((data.Profiles||[]).map(x=>[x.ID,x.Name]),r.Profile);
   const baud=select([["","Radio default"+(r.DefaultBaud?" ("+r.DefaultBaud+")":"")],...[1200,2400,4800,9600,19200,38400,57600,115200].map(b=>[String(b),String(b)])],r.Baud?String(r.Baud):"");
   const modemSel=select(modemOpts(r.NoCAT,r.Modem),r.Modem||"");
   const fields=[["Display name",name],["Radio model",models],["Modem",modemSel],...(!r.NoCAT?[["CAT baud rate",baud],["CAT device (empty = find it)",cat]]:[]),["Audio card (empty = find it)",audio],["Bands (hf,vhf,uhf)",bands]];
   const edit=hid(form("Save",fields,async()=>{
    const want=[["name",name.value,r.Name||""],["profile",models.value,r.Profile||""],...(!r.NoCAT?[["baud",baud.value,r.Baud?String(r.Baud):""],["cat",cat.value,r.Cat||""]]:[]),["audio",audio.value,r.Audio||""],["bands",bands.value,r.Bands||""]].filter(([k,v,old])=>v!==old&&!(k==="bands"&&v===""));
    const modemChanged=modemSel.value!==(r.Modem||"");
    if(!want.length&&!modemChanged){show("Nothing changed");return}
    try{for(const [k,v] of want)await api("rig.set",r.ID,k,v);let saved="Saved";if(modemChanged){const m=await api("rig.modem",r.ID,modemSel.value);if(typeof m==="string"&&m.includes("Pat"))saved+=". "+m.slice(m.indexOf("Pat"))}show(saved);await load();await offerRestart("")}catch(e){await load()}
   }));
   const eff=r.Baud||r.DefaultBaud;
   const pk=data.Packet?.[r.ID]||{}, pkText=Object.entries(pk).filter(([,v])=>v).map(([k,v])=>k+" "+v).join(", ");
   const field=select([["baud","Modem baud"],["call","Callsign"],["txdelay","TX delay"],["txtail","TX tail"],["persist","Persistence"],["slottime","Slot time"],["digipeat","Digipeater on/off"]]),value=input("Value");
   const packet=r.Modem==="direwolf"?hid(form("Save packet setting",[["Setting",field],["Value",value]],()=>act("packet.settings",r.ID,field.value,value.value))):null;
   const summary=[r.Radio,r.Modem?(modemNames[r.Modem]||r.Modem):"control only",(!r.NoCAT&&eff)?eff+" baud"+(r.Baud?"":" (radio default)"):null,r.Bands||null,r.Ports||null,r.Hardware,pkText?"packet: "+pkText:null].filter(Boolean).join(" · ");
   panel.append(item(r.Name?r.Name+" ("+r.ID+")":r.ID,summary,[button(r.On?"Turn off":"Turn on",()=>act("rig.toggle",r.ID)),pencil(edit),packet?pencil(packet,"Packet"):null,remove("rig",r.ID)],edit,packet));
  }
 }
 function renderUpdates(){
  const progs=Object.fromEntries((data.Programs||[]).map(p=>[p.Name,p]));
  const needs=u=>u.status==="update available"; // a development build is not behind a release: the note below says so, nothing counts it
  const all=(data.Updates?.programs||[]).filter(r=>r.status!=="not installed");
  // What hamstack itself can update, so it can be ticked: its own installs update normally; a program the package
  // manager owns can only be built from source here (it updates with the system otherwise).
  const kindOf=u=>{const p=progs[u.name]||{};if(u.name==="hamstack"||u.status!=="update available")return "";if(p.Origin==="system package")return p.CanSource?"source":"";return "update"};
  const updatable=all.filter(u=>kindOf(u));
  const bulk=button("",()=>{});
  const refreshBulk=()=>{const n=picked.size;bulk.textContent=n?"Update selected ("+n+")":"Update selected";bulk.disabled=busy||!n};
  const runBulk=async ()=>{
   const normal=[...picked].filter(([,k])=>k==="update").map(([n])=>n), src=[...picked].filter(([,k])=>k==="source").map(([n])=>n);
   if(!normal.length&&!src.length)return;
   const text="Update "+(normal.length+src.length)+" program"+(normal.length+src.length>1?"s":"")+":"+(normal.length?"\n  "+normal.join(", "):"")+(src.length?"\n\nBuilt from source (slow; your package stays as it is and hamstack uses the newer build):\n  "+src.join(", "):"")+"\n\nThis runs in the background. Progress and the full output show under Activity.";
   if(!await askConfirm(text))return;
   try{startedJob(await api("program.bulk","",normal.join(","),src.join(","),true));picked.clear();render()}catch(e){}
  };
  bulk.onclick=runBulk;
  const checks=[];
  panel.append(toolbar(button("Check releases now",()=>act("updates.check")),
   updatable.length?button("Select all",()=>{for(const u of updatable)picked.set(u.name,kindOf(u));checks.forEach(c=>c.sync());refreshBulk()}):null,
   updatable.length?button("Clear",()=>{picked.clear();checks.forEach(c=>c.sync());refreshBulk()}):null,
   updatable.length?bulk:null),
   el("p",{className:"muted wide",textContent:"Checks run when the page loads and every hour. Nothing is installed without your say-so."+(updatable.length?" Tick the programs to update and press Update selected: one job, with progress under Activity.":"")}));
  refreshBulk();
  for(const u of [...all.filter(needs),...all.filter(x=>!needs(x))]){
   const p=progs[u.name]||{}, acts=[], notes=[];
   const summary=u.installed+" → "+(u.latest||"unchecked")+" · "+u.status;
   const kind=kindOf(u);
   if(kind){
    const cb=el("input",{type:"checkbox",checked:picked.has(u.name),onchange:()=>{if(cb.checked)picked.set(u.name,kind);else picked.delete(u.name);refreshBulk()}});
    checks.push({sync:()=>{cb.checked=picked.has(u.name)}});
    acts.push(el("label",{style:"display:flex;gap:6px;align-items:center;margin:0",title:kind==="source"?"will be built from source":"will be updated"},cb,"select"));
   }
   if(u.error)notes.push(["warn",u.error]);
   if(u.name==="hamstack"){
    if(u.status==="update available"||u.status==="development build; release available")acts.push(button("Update hamstack",updateSelfFlow)); // up to date: nothing to install, and on a newer build it would go back
    if(p.Rollback==="self")acts.push(button("Roll back to "+p.Previous,()=>rollbackSelfFlow(p.Previous)));
    if(u.status==="development build; release available")notes.push(["muted","This is a development build. The newest published release may not contain what it has."]);
    else if(u.status==="update available")notes.push(["muted","Updates from hamstack's own releases (checksum verified). The program being replaced is kept, so Roll back puts it straight back."]);
    else if(p.Rollback==="self")notes.push(["muted","The previous hamstack ("+p.Previous+") is kept: Roll back switches to it."]);
   }else if(u.status==="update available"||u.status==="newer upstream, not packaged yet"){
    const inst=p.Installed||u.installed;
    if(p.Origin==="system package"){
     if(p.Held)notes.push(["warn","Held back: the package manager has been told not to update "+p.Package+", so system updates skip it. To allow it, run on the computer: sudo apt-mark unhold "+p.Package+" (then System, Update the system). To force the newer version regardless, build it from source below."]);
     else if(p.Candidate&&vcmp(p.Candidate,inst)>0)notes.push(["muted","Your distribution has a newer package ready ("+p.Candidate+"): System, Update the system installs it."]);
     else notes.push(["muted","Installed by your package manager, which currently offers "+(p.Candidate||inst)+". "+u.latest+" is newer upstream but not packaged for your distribution yet, so it will arrive with system updates once it is. Nothing is held back or broken."+(p.CanSource?" To have it sooner, build it from source: your package stays as it is, and hamstack uses the newer build.":"")]);
     if(p.CanSource)acts.push(button("Build "+u.latest+" from source",()=>installProgram(u.name,true,true)));
    }else{
     acts.push(button("Update to "+u.latest,()=>installProgram(u.name,true,false)));
     if(p.CanSource)acts.push(button("Build from source",()=>installProgram(u.name,true,true)));
     notes.push(["muted","Installed by hamstack under ~/.local, so hamstack updates it. The plan is shown first."]);
    }
   }
   if(u.name!=="hamstack"&&p.Rollback==="distro")acts.push(button("Go back to the distribution's version",async ()=>{if(await askConfirm("Remove hamstack's build of "+u.name+" from ~/.local? Programs then use the version your package manager installed."))act("program.rollback",u.name,"","",true)}));
   if(u.name!=="hamstack"&&p.Rollback==="remove")acts.push(button("Remove hamstack's copy",async ()=>{if(await askConfirm("Remove hamstack's copy of "+u.name+" from ~/.local? There is no other copy on this computer, so the program will be uninstalled. Its data (settings, logs, mail) is not touched."))act("program.rollback",u.name,"","",true)}));
   panel.append(item(u.name,summary,acts,...notes.map(([cls,t])=>el("p",{className:cls+" explain",textContent:t}))));
  }
 }
 function render(){
  $("manage-nav").replaceChildren(...tabs.map(t=>button(t,()=>{current=t;render()})));
  [...$("manage-nav").children].forEach((b,i)=>{b.className=tabs[i]===current?"active":"";b.setAttribute("aria-current",tabs[i]===current?"page":"false")});
  panel.replaceChildren();status.className="";
  const rows=data[current]||[];
  if(current==="Rigs"){renderRigs(rows)
  }else if(current==="Sites"){
   const sid=input("site-name"),add=hid(form("Save",[["Name",sid]],()=>act("site.add",sid.value)));
   panel.append(toolbar(button("+ Save this setup as a site",()=>reveal(add))),add);
   for(const r of rows){const grid=input("Grid square",r.Grid),f=hid(form("Save grid",[["Grid square",grid]],()=>act("site.grid",r.ID,grid.value)));panel.append(item(r.ID,[r.Current?"Current site":"",r.Rigs,r.Station,r.Grid?"grid "+r.Grid:""].filter(Boolean).join(" · "),[r.Current?null:button("Switch here",()=>act("site.use",r.ID)),pencil(f,"Grid"),remove("site",r.ID)],f))}
  }else if(current==="Stations"){
   const sid=input("station-name"),call=input("Callsign"),add=hid(form("Add station",[["Name",sid],["Callsign",call]],()=>act("station.add",sid.value,call.value)));
   panel.append(toolbar(button("+ Add a station",()=>reveal(add)),button("Import Pat stations",()=>act("station.import"))),add);
   for(const r of rows){const access=select([["local","This computer"],["network","Local network"],["all","All interfaces"]],r.Access),f=hid(form("Save",[["Who can connect",access]],async ()=>{if(await askConfirm("Save access and restart Pat if running?"))act("station.access",r.ID,access.value)}));panel.append(item(r.ID,[r.Callsign,r.Active?"active":"",...(r.Relayed?["Pat's page through the dashboard at https://"+location.hostname+":"+r.PagePort+"/ (dashboard login); Pat itself on this computer only (Settings: Pat's page through the dashboard)"]:[r.Addr,"reachable from "+(accessName[r.Access]||r.Access)])].filter(Boolean).join(" · "),[r.Active?null:button("Use station",()=>act("station.use",r.ID)),pencil(f,"Access"),remove("station",r.ID)],f))}
  }else if(current==="Apps"){
   // Each installed app has a page of its own with its status, its settings and its recommended setup.
   const installed=(data.Programs||[]).filter(r=>r.Installed&&(r.AppID||r.Name==="pat"));
   panel.append(el("p",{className:"muted wide",textContent:"Each installed app has its own page: status, start at login, its settings and a recommended setup you can preview, apply and undo."}));
   for(const r of installed){const app=r.AppID||r.Name;panel.append(item(r.Name,r.Desc+" · "+r.Installed,[el("a",{className:"btn",href:"/apps/"+encodeURIComponent(app),textContent:"⚙ Settings"})]))}
   if(!installed.length)panel.append(el("p",{className:"muted wide",textContent:"No apps are installed yet. The Apps page can install one."}));
  }else if(current==="Devices"){
   for(const r of rows){const rig=select((data.Rigs||[]).map(x=>[x.ID,x.ID]),r.Assigned),f=hid(form("Assign",[["Rig",rig]],()=>act("device.assign",r.Key,rig.value)));panel.append(item(r.Label,[r.Kind,r.Detail,r.Assigned?"used by "+r.Assigned:"not assigned"].filter(Boolean).join(" · "),[pencil(f,"Assign")],f))}
  }else if(current==="Programs"){
   panel.append(toolbar(button("Check upstream versions",()=>act("program.latest"))));
   for(const r of rows){const update=(data.Updates?.programs||[]).find(x=>x.name===r.Name);
    const run=async(source=false)=>{if(r.Name==="hamstack"){await updateSelfFlow();return}await installProgram(r.Name,!!r.Installed,source)};
    panel.append(item(r.Name,r.Desc+" · "+(r.Installed?"installed "+r.Installed+" ("+r.Origin+")":"not installed")+(update?.latest&&update.status!=="up to date"?" · latest "+update.latest+", "+update.status:"")+(r.Needs?" · needs "+r.Needs:""),[button(r.Installed?"Review update plan":"Review install plan",()=>run()),r.CanSource?button("Build from source",()=>run(true)):null]))}
  }else if(current==="Settings"){
   // Three levels: the normal list; Advanced (folded): what changes what goes on the air or who reaches the station;
   // Expert (in Expert mode only): licence- and shell-level. Turning a risky one on asks for the dashboard password.
   const expert=!!data.Dashboard?.expert;
   const settingRow=(r,into)=>{
    if(r.Key==="data2g-password"){ // set here, not in a terminal: piped to Data2G, and the dashboard password asked again
     const pw=input("New password"),again=input("Again");pw.type=again.type="password";pw.autocomplete=again.autocomplete="new-password";pw.minLength=again.minLength=8;
     const rig=(r.Args||[])[2]||"";
     const f=hid(form("Set password",[["New password",pw],["Again",again]],async()=>{if(pw.value!==again.value){show("The two passwords do not match.");return}try{show(await api("data2g.password",rig,"","",true,pw.value));pw.value=again.value=""}catch(e){}}));
     into.append(item("Data2G's page password",r.Value+" · Data2G asks for it when its page opens. At least 8 characters.",[pencil(f,r.Value==="set"?"Change":"Set")],f));return}
    if(r.Kind==="exec"){const target={maintenance:"Maintenance",updates:"Updates","self-update":"Updates",web:"Remote access",desktop:"Remote access","web-password":"Remote access",groups:"Maintenance",linger:"Maintenance"}[r.Key];into.append(item(r.Label,r.Hint,[target?button("Configure",()=>go(target)):null],target?null:el("code",{textContent:"hamstack "+(r.Args||[]).join(" ")})));return}
    // Each one says where it is now and, once it differs, what its default is, with a way back to it.
    const now=v=>v==="on"?"On":v==="off"?"Off":v;
    const state=v=>now(v)+(r.Changed?" (default: "+r.Default+")":r.Default?" (the default)":"");
    const back=r.Changed?button("Back to default",()=>act("setting.set",r.Key,"default")):null;
    if(r.Kind==="toggle"){into.append(item(r.Label,state(r.Value)+" · "+r.Hint,[button(r.Value==="on"?"Turn off":"Turn on",()=>act("setting.set",r.Key,r.Value==="on"?"off":"on")),back]));return}
    const value=input(r.Label,r.Value),f=hid(form("Save",[[r.Label,value]],()=>act("setting.set",r.Key,value.value)));into.append(item(r.Label,state(r.Value||"not set")+" · "+r.Hint,[pencil(f),back],f));
   };
   const sites=(data.Sites||[]).length>0; // without a site the grid has no other home, so it stays here
   const elsewhere=r=>r.Key.startsWith("rig:")||["maintenance","updates","self-update","web","desktop","web-password","groups","linger","data2g-password"].includes(r.Key)||(r.Key==="grid"&&sites);
   const homes=el("div",{className:"card wide"},el("h3",{textContent:"Set elsewhere"}));
   const link=(label,what,go_)=>homes.append(el("div",{className:"row-between"},el("div",{},el("strong",{textContent:label}),el("div",{className:"muted",textContent:what})),el("div",{className:"actions"},go_)));
